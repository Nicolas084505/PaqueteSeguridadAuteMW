name: Action to build and Publish NuGet package to github package registry

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Important for GitVersion to work properly

      # Install and calculate the new version with GitVersion
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: 5.x

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.7

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 6.0.x

      # Build and Pack NuGet package
      - name: Build and Pack NuGet package
        run: dotnet pack src/services/Florage.Shared/Florage.Shared.csproj -p:Version='${{ steps.gitversion.outputs.SemVer }}' -c Release

      # Upload NuGet package to GitHub
      - name: Upload NuGet package to GitHub
        uses: actions/upload-artifact@v2
        with:
          name: nugetPackage
          path: bin/Release/

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'  # only run job if on the main branch

    steps:
      # Push NuGet package to GitHub packages
      - name: Download nuget package artifact
        uses: actions/download-artifact@v1.0.0
        with:
          name: nugetPackage

      - name: Prep packages
        run: dotnet nuget add source --username yourusername --password ${{ secrets.PAQUETES_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/yourusername/index.json"

      - name: Push package to GitHub packages
        if: needs.build.outputs.CommitsSinceVersionSource > 0  # Only release if there has been a commit/version change
        run: dotnet nuget push nugetPackage/*.nupkg --api-key ${{ secrets.PAQUETES_TOKEN }} --source "github"

      # Create release
      - name: Create Release
        if: needs.build.outputs.CommitsSinceVersionSource > 0  # Only release if there has been a commit/version change
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.PAQUETES_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.Version }}
          release_name: Release ${{ needs.build.outputs.Version }}

      - name: Create Release (Upload artifacts)
        if: needs.build.outputs.CommitsSinceVersionSource > 0
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.build.outputs.Version }}
          name: Release ${{ needs.build.outputs.Version }}
          artifacts: "nugetPackage/*"
          token: ${{ secrets.PAQUETES_TOKEN }}
