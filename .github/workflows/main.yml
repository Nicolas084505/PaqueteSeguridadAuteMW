name:  Action to build and  Publish NuGet package to github package registry

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      Version: ${{ steps.gitversion.outputs.SemVer }}
      CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0  # Important for GitVersion to work properly

      # Install and calculate the new version with GitVersion
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.7
        with:
          versionSpec: 5.x

      - name: Determine Version
        uses: gittools/actions/gitversion/execute@v0.9.7
        id: gitversion # step id used as reference as reference for outputvalues

      - name: Display GitVersion outputs
        run: |
          echo "Version: ${{ steps.gitversion.outputs.SemVer }}"
          echo "CommitsSinceVersionSource: ${{ steps.gitversion.outputs.CommitsSinceVersionSource }}"

      # Build and pack the project
      - name: Setup .NET
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 8.0.x

      - name: Build and Pack NuGet package
        run: dotnet pack Seguridad/SeguridadMW.Middleware/SeguridadMW.Middleware.csproj -p:Version='${{ steps.gitversion.outputs.SemVer }}' -c Release

      - name: Upload NuGet package to GitHub
        uses: actions/upload-artifact@v2
        with:
          name: nugetPackage
          path: bin/Release/

  release:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'  # Only run on master branch

    steps:
      # Push NuGet package to GitHub Packages
      - name: Download NuGet package artifact
        uses: actions/download-artifact@v1.0.0
        with:
          name: nugetPackage

      - name: Prep packages
        run: dotnet nuget add source --username yourusername --password ${{ secrets.PAQUETES_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/yourusername/index.json"

      - name: Push package to GitHub Packages
        if : needs.build.outputs.CommitsSinceVersionSource }}" != "0" ]; then dotnet nuget push **/*.nupkg --api-key ${{ secrets.PAQUETES_TOKEN }} --source "github"
        run: dotnet nuget add source --username yourusername --password ${{ secrets.PAQUETES_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/yourusername/index.json"

